<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>富瑞财富 · 客户现场方案合集 | Triton Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <script src="auth.v2.js" defer></script>
  <style>
    :root {
      --navy: #0a0e14;
      --navy-2: #11161f;
      --gold: #c9a24a;
      --gold-soft: #e3c074;
      --line: rgba(201,162,74,.28);
      --text: #e8e6e0;
      --muted: #9aa3b0;
      --paper: #0a0e14;
      --serif-en: Arial, Helvetica, sans-serif;
      --serif-cn: 'Noto Serif SC', Songti SC, serif;
      --sans-cn: 'Noto Sans SC', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--sans-cn);
      background: var(--paper);
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    .shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 18% 0%, rgba(201,162,74,.13), transparent 34%),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,.04), transparent 30%),
        linear-gradient(135deg, rgba(10,14,20,.99), rgba(17,22,31,.98) 48%, rgba(10,14,20,.99)),
        var(--navy);
    }

    .topbar {
      height: 62px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 230px;
      gap: 12px;
      color: var(--text);
    }

    .brand img {
      height: 34px;
      width: auto;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-rule {
      width: 1px;
      height: 28px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .brand-title {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--gold);
      font-size: 9px;
      line-height: 1;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .switcher {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 2px;
      background: rgba(255,255,255,.035);
      min-width: 720px;
    }

    .tab {
      border: 0;
      border-radius: 2px;
      padding: 9px 14px;
      min-height: 38px;
      color: #C7D2E1;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .tab small {
      display: block;
      color: #7F92AA;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: left;
    }

    .tab span {
      display: block;
      line-height: 1.1;
      text-align: left;
      white-space: nowrap;
    }

    .tab.active {
      background: rgba(201,168,76,.16);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(201,168,76,.36);
    }

    .tab.active small { color: var(--gold-soft); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 280px;
    }

    .badge {
      border: 1px solid rgba(201,168,76,.45);
      color: var(--gold-soft);
      border-radius: 2px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .btn {
      border: 0;
      border-radius: 2px;
      min-height: 32px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      color: var(--navy);
      background: var(--gold);
      transition: transform .16s ease, filter .16s ease;
      white-space: nowrap;
    }

    .btn.secondary {
      color: #D8E2F0;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      background:
        radial-gradient(circle at 14% 0%, rgba(201,162,74,.12), transparent 34%),
        linear-gradient(180deg, #0a0e14, #0f141d);
      position: relative;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0f141d;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      -webkit-overflow-scrolling: touch;
    }

    .frame.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-note {
      display: none;
      padding: 10px 14px;
      color: #C7D2E1;
      background: rgba(255,255,255,.055);
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 12px;
      line-height: 1.5;
    }

    .mobile-launcher {
      display: none;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .shell { min-height: 100vh; height: auto; background: var(--paper); }
      .topbar {
        height: auto;
        align-items: stretch;
        flex-direction: column;
        padding: 10px 12px;
      }
      .brand, .switcher, .actions {
        width: 100%;
        min-width: 0;
      }
      .brand {
        justify-content: center;
      }
      .brand img { height: 28px; }
      .brand-rule { height: 24px; }
      .brand-title {
        font-size: 9px;
        letter-spacing: 0;
        white-space: normal;
        line-height: 1.18;
      }
      .brand-subtitle {
        font-size: 6.5px;
        letter-spacing: .08em;
      }
      .switcher {
        display: none;
      }
      .tab {
        justify-content: center;
      }
      .actions {
        display: none;
      }
      .stage {
        display: none;
      }
      .mobile-launcher {
        display: grid;
        gap: 10px;
        padding: 12px;
        background:
          radial-gradient(circle at 10% 0%, rgba(201,162,74,.13), transparent 36%),
          linear-gradient(180deg, #0a0e14, #0f141d);
      }
      .mobile-card {
        display: block;
        padding: 15px 16px;
        border: 1px solid rgba(201,162,74,.24);
        border-left: 4px solid var(--gold);
        background: linear-gradient(180deg, #11161f, #0f141d);
        color: var(--text);
        text-decoration: none;
        box-shadow: 0 16px 40px rgba(0,0,0,.25);
      }
      .mobile-card small {
        display: block;
        color: var(--gold-soft);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .mobile-card strong {
        display: block;
        font-family: var(--serif-cn);
        font-weight: 500;
        font-size: 14px;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .mobile-card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .mobile-note {
        display: block;
        padding: 8px 12px;
        font-size: 11px;
        color: var(--muted);
        background: var(--paper);
        border-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="triton-logo.png" alt="Triton Wealth" />
        <div class="brand-rule"></div>
        <div>
          <div class="brand-title">富瑞财富客户方案中心</div>
          <div class="brand-subtitle">Client Advisory Workspace</div>
        </div>
      </div>

      <nav class="switcher" aria-label="方案切换">
        <button class="tab active" type="button" data-target="portfolio" aria-pressed="true">
          <div>
            <small>Proposal</small>
            <span>分隔基金投资组合</span>
          </div>
        </button>
        <button class="tab" type="button" data-target="tclass" aria-pressed="false">
          <div>
            <small>Strategy</small>
            <span>Fidelity T-Class 现金流</span>
          </div>
        </button>
        <button class="tab" type="button" data-target="tax" aria-pressed="false">
          <div>
            <small>Tax</small>
            <span>投资借款抵税</span>
          </div>
        </button>
        <button class="tab" type="button" data-target="estate" aria-pressed="false">
          <div>
            <small>Estate</small>
            <span>传承税负诊断</span>
          </div>
        </button>
      </nav>

      <div class="actions">
        <span class="badge" id="activeBadge">PORTFOLIO</span>
        <button class="btn secondary" type="button" id="openBtn">单独打开</button>
        <button class="btn" type="button" id="exportBtn">导出PDF</button>
      </div>
    </header>

    <div class="mobile-note">
      移动端请选择一个方案单独打开；独立页面可正常上下滑动。
    </div>

    <section class="mobile-launcher" aria-label="移动端方案选择">
      <a class="mobile-card" href="triton_portfolio_presentation.html">
        <small>Proposal</small>
        <strong>分隔基金投资组合</strong>
        <span>查看稳健型、均衡型、进取型组合与税务对比。</span>
      </a>
      <a class="mobile-card" href="fidelity_tclass_strategy.html">
        <small>Strategy</small>
        <strong>Fidelity T-Class 现金流</strong>
        <span>查看 T5 / T8 月度现金流、税务递延与本金演变。</span>
      </a>
      <a class="mobile-card" href="investment_tax_calculator.html">
        <small>Tax</small>
        <strong>投资借款抵税计算器</strong>
        <span>演示投资贷款利息抵扣、节税和税后借款成本。</span>
      </a>
      <a class="mobile-card" href="estate_tax_diagnostic.html">
        <small>Estate</small>
        <strong>传承税负诊断</strong>
        <span>估算企业、房产、注册账户和税务流动性缺口。</span>
      </a>
    </section>

    <main class="stage">
      <iframe
        id="frame-portfolio"
        class="frame active"
        title="分隔基金投资组合"
        scrolling="yes"
        src="triton_portfolio_presentation.html?embedded=1"></iframe>
      <iframe
        id="frame-tclass"
        class="frame"
        title="Fidelity T-Class 现金流策略"
        scrolling="yes"
        src="fidelity_tclass_strategy.html?embedded=1"></iframe>
      <iframe
        id="frame-tax"
        class="frame"
        title="投资借款抵税计算器"
        scrolling="yes"
        src="investment_tax_calculator.html?embedded=1"></iframe>
      <iframe
        id="frame-estate"
        class="frame"
        title="传承税负诊断"
        scrolling="yes"
        src="estate_tax_diagnostic.html?embedded=1"></iframe>
    </main>
  </div>

  <script>
    const views = {
      portfolio: {
        frame: document.getElementById('frame-portfolio'),
        file: 'triton_portfolio_presentation.html',
        badge: 'PORTFOLIO'
      },
      tclass: {
        frame: document.getElementById('frame-tclass'),
        file: 'fidelity_tclass_strategy.html',
        badge: 'T-CLASS'
      },
      tax: {
        frame: document.getElementById('frame-tax'),
        file: 'investment_tax_calculator.html',
        badge: 'TAX'
      },
      estate: {
        frame: document.getElementById('frame-estate'),
        file: 'estate_tax_diagnostic.html',
        badge: 'ESTATE'
      }
    };

    function viewFromHash() {
      return location.hash === '#tclass' ? 'tclass'
        : location.hash === '#tax' ? 'tax'
        : location.hash === '#estate' ? 'estate'
        : 'portfolio';
    }

    let activeView = viewFromHash();

    function setActiveView(view) {
      if (window.matchMedia('(max-width: 980px)').matches) {
        window.location.href = views[view].file;
        return;
      }
      activeView = view;
      Object.entries(views).forEach(([key, meta]) => {
        const on = key === view;
        meta.frame.classList.toggle('active', on);
        document.querySelector(`[data-target="${key}"]`).classList.toggle('active', on);
        document.querySelector(`[data-target="${key}"]`).setAttribute('aria-pressed', String(on));
      });
      document.getElementById('activeBadge').textContent = views[view].badge;
      history.replaceState(null, '', view === 'portfolio' ? '#portfolio' : `#${view}`);
    }

    document.querySelectorAll('[data-target]').forEach(button => {
      button.addEventListener('click', () => setActiveView(button.dataset.target));
    });

    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(views[activeView].file, '_blank', 'noopener');
    });

    function exportActiveView() {
      const frame = views[activeView].frame;
      const btn = document.getElementById('exportBtn');
      btn.textContent = '准备中...';
      btn.disabled = true;
      try {
        if (frame.contentWindow && typeof frame.contentWindow.exportPDF === 'function') {
          frame.contentWindow.exportPDF();
        } else if (frame.contentWindow && typeof frame.contentWindow.print === 'function') {
          frame.contentWindow.print();
        } else {
          frame.contentWindow.postMessage({ type: 'TRITON_EXPORT_PDF' }, '*');
        }
      } catch (err) {
        frame.contentWindow.postMessage({ type: 'TRITON_EXPORT_PDF' }, '*');
      }
      setTimeout(() => {
        btn.textContent = '导出PDF';
        btn.disabled = false;
      }, 1800);
    }

    document.getElementById('exportBtn').addEventListener('click', exportActiveView);
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && String(event.key).toLowerCase() === 'p') {
        event.preventDefault();
        exportActiveView();
      }
    });

    window.addEventListener('hashchange', () => {
      const next = viewFromHash();
      if (next !== activeView) setActiveView(next);
    });

    setActiveView(activeView);
  </script>
</body>
</html>
