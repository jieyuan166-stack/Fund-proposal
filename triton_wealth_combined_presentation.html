<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>富瑞财富 · 客户现场方案合集 | Triton Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="auth.v2.js" defer></script>
  <style>
    :root {
      --navy: #0A1628;
      --navy-2: #10243D;
      --gold: #C9A84C;
      --gold-soft: #E8D5A3;
      --line: rgba(201,168,76,.24);
      --text: #E7EEF8;
      --muted: #8CA1BA;
      --paper: #F6F8FB;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--paper);
      color: #172033;
    }

    body {
      overflow: hidden;
    }

    .shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(135deg, rgba(10,22,40,.98), rgba(16,36,61,.96) 48%, rgba(10,22,40,.98)),
        var(--navy);
    }

    .topbar {
      height: 62px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 230px;
      gap: 12px;
      color: var(--text);
    }

    .brand img {
      height: 34px;
      width: auto;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-rule {
      width: 1px;
      height: 28px;
      background: var(--line);
      flex: 0 0 auto;
    }

    .brand-title {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--gold);
      font-size: 9px;
      line-height: 1;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .switcher {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px;
      background: rgba(255,255,255,.055);
      min-width: 430px;
    }

    .tab {
      border: 0;
      border-radius: 7px;
      padding: 9px 15px;
      min-height: 38px;
      color: #C7D2E1;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .tab small {
      display: block;
      color: #7F92AA;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: left;
    }

    .tab span {
      display: block;
      line-height: 1.1;
      text-align: left;
      white-space: nowrap;
    }

    .tab.active {
      background: rgba(201,168,76,.16);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(201,168,76,.36);
    }

    .tab.active small { color: var(--gold-soft); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 280px;
    }

    .badge {
      border: 1px solid rgba(201,168,76,.45);
      color: var(--gold-soft);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      min-height: 32px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      color: var(--navy);
      background: var(--gold);
      transition: transform .16s ease, filter .16s ease;
      white-space: nowrap;
    }

    .btn.secondary {
      color: #D8E2F0;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.09);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--paper);
      position: relative;
    }

    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .frame.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-note {
      display: none;
      padding: 10px 14px;
      color: #C7D2E1;
      background: rgba(255,255,255,.055);
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .shell { min-height: 100vh; height: auto; }
      .topbar {
        height: auto;
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }
      .brand, .switcher, .actions {
        width: 100%;
        min-width: 0;
      }
      .brand {
        justify-content: center;
      }
      .switcher {
        display: grid;
        grid-template-columns: 1fr;
      }
      .tab {
        justify-content: center;
      }
      .actions {
        justify-content: center;
        flex-wrap: wrap;
      }
      .stage {
        height: calc(100vh - 220px);
        min-height: 620px;
      }
      .mobile-note { display: block; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="triton-logo.png" alt="Triton Wealth" />
        <div class="brand-rule"></div>
        <div>
          <div class="brand-title">富瑞财富客户方案中心</div>
          <div class="brand-subtitle">Client Advisory Workspace</div>
        </div>
      </div>

      <nav class="switcher" aria-label="方案切换">
        <button class="tab active" type="button" data-target="portfolio" aria-pressed="true">
          <div>
            <small>Proposal</small>
            <span>分隔基金投资组合</span>
          </div>
        </button>
        <button class="tab" type="button" data-target="tclass" aria-pressed="false">
          <div>
            <small>Strategy</small>
            <span>Fidelity T-Class 现金流</span>
          </div>
        </button>
      </nav>

      <div class="actions">
        <span class="badge" id="activeBadge">PORTFOLIO</span>
        <button class="btn secondary" type="button" id="openBtn">单独打开</button>
        <button class="btn" type="button" id="exportBtn">导出PDF</button>
      </div>
    </header>

    <div class="mobile-note">
      移动端建议横屏展示；两个方案仍可在下方同一页面内切换和导出。
    </div>

    <main class="stage">
      <iframe
        id="frame-portfolio"
        class="frame active"
        title="分隔基金投资组合"
        src="triton_portfolio_presentation.html?embedded=1"></iframe>
      <iframe
        id="frame-tclass"
        class="frame"
        title="Fidelity T-Class 现金流策略"
        src="fidelity_tclass_strategy.html?embedded=1"></iframe>
    </main>
  </div>

  <script>
    const views = {
      portfolio: {
        frame: document.getElementById('frame-portfolio'),
        file: 'triton_portfolio_presentation.html',
        badge: 'PORTFOLIO'
      },
      tclass: {
        frame: document.getElementById('frame-tclass'),
        file: 'fidelity_tclass_strategy.html',
        badge: 'T-CLASS'
      }
    };

    let activeView = location.hash === '#tclass' ? 'tclass' : 'portfolio';

    function setActiveView(view) {
      activeView = view;
      Object.entries(views).forEach(([key, meta]) => {
        const on = key === view;
        meta.frame.classList.toggle('active', on);
        document.querySelector(`[data-target="${key}"]`).classList.toggle('active', on);
        document.querySelector(`[data-target="${key}"]`).setAttribute('aria-pressed', String(on));
      });
      document.getElementById('activeBadge').textContent = views[view].badge;
      history.replaceState(null, '', view === 'tclass' ? '#tclass' : '#portfolio');
    }

    document.querySelectorAll('[data-target]').forEach(button => {
      button.addEventListener('click', () => setActiveView(button.dataset.target));
    });

    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(views[activeView].file, '_blank', 'noopener');
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const frame = views[activeView].frame;
      const btn = document.getElementById('exportBtn');
      btn.textContent = '准备中...';
      btn.disabled = true;
      try {
        if (frame.contentWindow && typeof frame.contentWindow.exportPDF === 'function') {
          frame.contentWindow.exportPDF();
        } else {
          frame.contentWindow.postMessage({ type: 'TRITON_EXPORT_PDF' }, '*');
        }
      } catch (err) {
        frame.contentWindow.postMessage({ type: 'TRITON_EXPORT_PDF' }, '*');
      }
      setTimeout(() => {
        btn.textContent = '导出PDF';
        btn.disabled = false;
      }, 1800);
    });

    window.addEventListener('hashchange', () => {
      const next = location.hash === '#tclass' ? 'tclass' : 'portfolio';
      if (next !== activeView) setActiveView(next);
    });

    setActiveView(activeView);
  </script>
</body>
</html>
